name: Publish MG gallery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mg-gallery-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build interactive gallery
        run: |
          gsap_version=$(node -p 'require("./templates/hyperframes/package.json").devDependencies.gsap')
          npm install --no-save --package-lock=false --ignore-scripts "gsap@$gsap_version"
          node scripts/preview-mg-templates.mjs --html-only
      - uses: actions/upload-pages-artifact@v4
        with:
          path: assets/previews/mg/gallery

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
