<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cut-motion Composition</title>
    <script src="./assets/gsap.min.js"></script>
    <link rel="stylesheet" href="./caption.css" />
    <style>
      @font-face {
        font-family: "Smiley Sans";
        src: url("./assets/fonts/smiley-sans-oblique.woff2") format("woff2");
        font-display: block;
      }

      :root {
        --ink: #161719;
        --paper: #f6f4ed;
        --blue: #3864f6;
        --violet: #8a67f6;
        --coral: #ef5d57;
        --green: #23c98a;
        --connector: rgba(255, 255, 255, 0.72);
      }

      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { font-family: "Smiley Sans", sans-serif; font-weight: 400; font-synthesis: none; color: var(--ink); }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }

      #a-roll {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .clip { position: absolute; inset: 0; }
      .scene-inner { position: absolute; inset: 0; }

      .no-orphan-line {
        overflow-wrap: normal;
        word-break: normal;
        text-wrap: balance;
      }
      /* CUT_MOTION_MG_STYLES */
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-fps="30" data-duration="__CUT_MOTION_DURATION__" data-layout-constraints="enforced" data-motion-contract="enforced" data-runtime-layout="hyperframes" data-modular-mg="enforced" data-caption-bottom-ratio="0.2" data-caption-font-weight="400">
      <video id="a-roll" class="clip" src="./assets/input-video.mp4" data-start="0" data-duration="__CUT_MOTION_DURATION__" data-media-start="__CUT_MOTION_MEDIA_START__" data-track-index="0" muted playsinline preload="auto"></video>
      <audio id="source-audio" src="./assets/input-video.mp4" data-start="0" data-duration="__CUT_MOTION_DURATION__" data-media-start="__CUT_MOTION_MEDIA_START__" data-track-index="1" data-volume="1" preload="auto"></audio>

      <!-- CUT_MOTION_MG_FRAGMENTS -->
      <!-- CUT_MOTION_CAPTIONS_START -->
      <!-- CUT_MOTION_CAPTIONS_END -->
    </div>

    <script>
      /* CUT_MOTION_CONTENT_COLLISION */
      window.__motionContract = (currentTime = null) => {
        const root = document.querySelector("#root");
        const rootRect = root.getBoundingClientRect();
        const visible = (element) => {
          const style = getComputedStyle(element);
          const rect = clippedContentRect(element, root);
          return style.display !== "none" && style.visibility !== "hidden" && Number(style.opacity) > 0.01 && rect.width > 0 && rect.height > 0;
        };
        for (const element of document.querySelectorAll('[data-motion-surface="container"][data-border-policy="none"]')) {
          const style = getComputedStyle(element);
          const borderWidth = ["borderTopWidth", "borderRightWidth", "borderBottomWidth", "borderLeftWidth"]
            .reduce((sum, property) => sum + Number.parseFloat(style[property] || "0"), 0);
          if (borderWidth > 0) throw new Error("motion_contract_container_border");
        }
        for (const element of document.querySelectorAll('[data-motion-role="connector"]')) {
          const token = element.dataset.colorToken;
          const property = element.dataset.colorProperty;
          const probe = document.createElement("span");
          probe.style.color = `var(--${token})`;
          document.body.appendChild(probe);
          const expected = getComputedStyle(probe).color;
          probe.remove();
          const actual = getComputedStyle(element).getPropertyValue(property);
          if (!expected || actual !== expected) throw new Error("motion_contract_connector_token");
        }
        const excludedLeaves = new Set(["VIDEO", "AUDIO", "SCRIPT", "STYLE", "SOURCE"]);
        const visibleLeaves = [...root.querySelectorAll("*")].filter((element) => element.children.length === 0
          && !excludedLeaves.has(element.tagName)
          && visible(element));
        for (const surface of document.querySelectorAll('[data-motion-surface="container"]')) {
          const units = [...surface.querySelectorAll('[data-collision-unit], [data-motion-role="indicator"], svg, img')]
            .filter(visible)
            .map((element) => element.closest('[data-collision-unit], [data-motion-role="indicator"]') || element);
          for (const element of visibleLeaves) {
            if (element.closest('[data-motion-surface="container"]') !== surface || !element.textContent.trim()) continue;
            if (!element.closest('[data-collision-unit], [data-motion-role="indicator"]')) units.push(element);
          }
          if (findContentCollision([...new Set(units)], (element) => clippedContentRect(element, root))) throw new Error("motion_contract_content_collision");
        }
        for (const element of visibleLeaves) {
          if (!element.closest("[data-motion-group]") && !element.closest("[data-motion-protected]")) {
            throw new Error("motion_contract_ungrouped_visual");
          }
          if (!visible(element)) continue;
          const rect = clippedContentRect(element, root);
          if (rect.left < rootRect.left - 1 || rect.top < rootRect.top - 1 || rect.right > rootRect.right + 1 || rect.bottom > rootRect.bottom + 1) {
            throw new Error("motion_contract_canvas_overflow");
          }
          const style = getComputedStyle(element);
          const borderWidth = ["borderTopWidth", "borderRightWidth", "borderBottomWidth", "borderLeftWidth"]
            .reduce((sum, property) => sum + Number.parseFloat(style[property] || "0"), 0);
          if (borderWidth > 0 && element.dataset.borderPolicy !== "allowed") throw new Error("motion_contract_leaf_border");
          if (element.textContent.trim() && Number.parseFloat(style.fontSize) < 42 && !element.dataset.informationRole) {
            throw new Error("motion_contract_tiny_label");
          }
        }
        for (const caption of document.querySelectorAll(".motion-caption-line")) {
          if (Number(getComputedStyle(caption).fontWeight) !== Number(root.dataset.captionFontWeight)) {
            throw new Error("motion_contract_caption_weight");
          }
        }
        const protectedRects = [...document.querySelectorAll("[data-motion-protected]")].filter(visible).map((element) => element.getBoundingClientRect());
        for (const element of visibleLeaves.filter((candidate) => !candidate.closest("[data-motion-protected]"))) {
          const rect = clippedContentRect(element, root);
          if (protectedRects.some((protectedRect) => rect.left < protectedRect.right && rect.right > protectedRect.left
            && rect.top < protectedRect.bottom && rect.bottom > protectedRect.top)) {
            throw new Error("motion_contract_protected_overlap");
          }
        }
        const visibleGroups = [...document.querySelectorAll("[data-motion-group]")].filter(visible);
        if (visibleGroups.filter((element) => element.dataset.axis === "A" && element.dataset.groupKind === "primary").length > 1
          || visibleGroups.filter((element) => element.dataset.axis === "A" && element.dataset.groupKind === "auxiliary").length > 1) {
          throw new Error("motion_contract_a_axis_accumulation");
        }
        for (const group of visibleGroups) {
          const start = Number(group.dataset.groupStart);
          const duration = Number(group.dataset.groupDuration);
          if (group.dataset.axis === "A" && group.dataset.faceCover !== "none" && duration > 3
            && group.dataset.faceCoverApproval !== "user") throw new Error("motion_contract_face_cover_duration");
          if (currentTime !== null && (currentTime < start - 1 / 30 || currentTime > start + duration + 1 / 30)) {
            throw new Error("motion_contract_group_lifetime");
          }
        }
        const revealGroups = new Map();
        for (const element of document.querySelectorAll("[data-reveal-group]")) {
          const group = revealGroups.get(element.dataset.revealGroup) || [];
          group.push(element);
          revealGroups.set(element.dataset.revealGroup, group);
        }
        for (const elements of revealGroups.values()) {
          const connectors = elements.filter((element) => element.dataset.motionRole === "connector");
          const containers = elements.filter((element) => element.dataset.motionSurface === "container");
          if (connectors.length && (!containers.length || connectors.some(visible) !== containers.some(visible))) {
            throw new Error("motion_contract_reveal_group");
          }
        }
        for (const connector of document.querySelectorAll('[data-motion-role="connector"]')) {
          const group = connector.closest("[data-motion-group]");
          if (group && connector.dataset.flowAxis !== group.dataset.primaryFlowAxis && connector.dataset.terminalBranch !== "true") {
            throw new Error("motion_contract_primary_flow");
          }
        }
      };
      window.__motionContract();
      const timeline = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });
      /* CUT_MOTION_MG_TIMELINES */
      let motionContractUpdateSerial = 0;
      timeline.eventCallback("onUpdate", () => {
        motionContractUpdateSerial += 1;
        window.__motionContract(timeline.time());
      });
      const seekTimeline = timeline.totalTime.bind(timeline);
      timeline.totalTime = function checkedTotalTime(value, suppressEvents) {
        if (arguments.length === 0) return seekTimeline();
        const serialBeforeSeek = motionContractUpdateSerial;
        const result = seekTimeline(value, suppressEvents);
        if (motionContractUpdateSerial === serialBeforeSeek) window.__motionContract(Number(value));
        return result;
      };
      window.__timelines = window.__timelines || {};
      window.__timelines.main = timeline;
    </script>
  </body>
</html>
